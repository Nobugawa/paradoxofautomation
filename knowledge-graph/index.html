<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>Knowledge Graph | Paradox of Automation</title>
<meta name="theme-color" content="#0e0f11" />
<style>
:root{--paper:#f4f0e7;--ink:#0e0f11;--muted:#6a645b;--line:#c8c0b2;--signal:#d64b2a;--card:#fffdf8;--max:1260px}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}.wrap{width:min(calc(100% - 34px),var(--max));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(244,240,231,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{text-decoration:none;font:700 1.06rem Georgia,serif}.nav-right{display:flex;gap:14px;align-items:center}.nav-right a{font-size:.83rem;text-decoration:none}.logout{border:1px solid var(--ink);padding:7px 10px}
.hero{padding:58px 0 34px;border-bottom:1px solid var(--line)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:800;font-size:.72rem;color:#9f3118;margin-bottom:14px}
h1{font:700 clamp(2.6rem,6vw,5.6rem)/.96 Georgia,serif;letter-spacing:-.045em;margin:0 0 18px}.deck{max-width:820px;font:1.2rem/1.55 Georgia,serif;color:#393630;margin:0}.meta{margin-top:20px;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.controls{padding:22px 0;border-bottom:1px solid var(--line);background:#ebe5d9}.control-grid{display:grid;grid-template-columns:1fr 190px 190px;gap:10px}input,select{width:100%;border:1px solid var(--ink);background:var(--card);padding:12px 13px;font:600 .92rem system-ui;color:var(--ink)}
.summary{padding:20px 0;display:flex;gap:22px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}.summary strong{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:80px}.node{background:var(--card);border:1px solid var(--line);padding:20px;position:relative}.node:hover{border-color:var(--ink)}.node-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.id{font:800 .8rem/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#9f3118;letter-spacing:.04em}.group{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.node h2{font:700 1.45rem/1.15 Georgia,serif;margin:9px 0 9px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.chip{font-size:.7rem;border:1px solid var(--line);padding:4px 6px;background:var(--paper)}.summarytext{font-size:.91rem;line-height:1.55;color:#403c36;margin:0 0 14px}.relations{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:6px;flex-wrap:wrap}.rel{font:700 .72rem ui-monospace,monospace;padding:5px 7px;border:1px solid var(--ink);background:transparent;cursor:pointer}.rel:hover{background:var(--ink);color:var(--paper)}.copy{position:absolute;right:16px;bottom:15px;border:0;background:none;font-size:.72rem;color:var(--muted);cursor:pointer}.copy:hover{color:var(--ink)}
.empty{padding:60px 0;font:1.3rem Georgia,serif;color:var(--muted)}
footer{position:fixed;right:12px;bottom:10px;font:700 .67rem ui-monospace,monospace;letter-spacing:.07em;color:#7b7469;background:rgba(244,240,231,.88);padding:5px 7px;border:1px solid rgba(14,15,17,.15)}
@media(max-width:820px){.control-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.nav-right a:first-child{display:none}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/">Paradox of Automation</a><div class="nav-right"><a href="/">Public site</a><a class="logout" href="/knowledge-graph/?logout=1">Log out</a></div></div></header>
<main>
<section class="hero"><div class="wrap"><div class="eyebrow">Private Editorial System</div><h1>Knowledge Graph</h1><p class="deck">The living map of concepts, research, articles, solutions, visuals, and relationships behind Paradox of Automation. IDs are permanent; titles can evolve.</p><div class="meta" id="meta">Loading…</div></div></section>
<section class="controls"><div class="wrap control-grid"><input id="search" type="search" placeholder="Search ID, title, concept, or phrase…" autofocus><select id="group"><option value="">All groups</option></select><select id="status"><option value="">All statuses</option></select></div></section>
<div class="wrap"><div class="summary" id="summary"></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No matching nodes.</div></div>
</main>
<footer>POA KG · V1.1</footer>
<script>
let DATA={nodes:[]}; const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const r=await fetch('/knowledge-graph/data/knowledge-graph.json',{cache:'no-store'}); DATA=await r.json(); setup(); render();}
function setup(){ $('#meta').textContent=`${DATA.version} · Updated ${DATA.updated} · ${DATA.nodeCount} nodes`;
 const groups=[...new Set(DATA.nodes.map(n=>n.group))].sort(); groups.forEach(v=>$('#group').insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
 const statuses=[...new Set(DATA.nodes.map(n=>n.status))].sort(); statuses.forEach(v=>$('#status').insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
 ['search','group','status'].forEach(id=>$('#'+id).addEventListener('input',render));}
function jump(id){$('#search').value=id; $('#group').value=''; $('#status').value=''; render(); window.scrollTo({top:120,behavior:'smooth'});}
function copyId(id){navigator.clipboard.writeText(id);}
function render(){const q=$('#search').value.trim().toLowerCase(),g=$('#group').value,s=$('#status').value;
 const nodes=DATA.nodes.filter(n=>(!g||n.group===g)&&(!s||n.status===s)&&(!q||[n.id,n.title,n.type,n.status,n.summary,...(n.related||[])].join(' ').toLowerCase().includes(q)));
 $('#summary').innerHTML=`<span><strong>${nodes.length}</strong> shown</span><span><strong>${DATA.nodeCount}</strong> total nodes</span><span>Search relationships by clicking any ID.</span>`;
 $('#empty').hidden=nodes.length!==0;
 $('#grid').innerHTML=nodes.map(n=>`<article class="node"><div class="node-top"><div class="id">${esc(n.id)}</div><div class="group">${esc(n.group)}</div></div><h2>${esc(n.title)}</h2><div class="chips"><span class="chip">${esc(n.type)}</span><span class="chip">${esc(n.status)}</span></div><p class="summarytext">${esc(n.summary)}</p>${(n.related||[]).length?`<div class="relations">${n.related.map(r=>`<button class="rel" onclick="jump('${esc(r)}')">${esc(r)}</button>`).join('')}</div>`:''}<button class="copy" onclick="copyId('${esc(n.id)}')">copy ID</button></article>`).join('');}
load().catch(e=>{document.querySelector('#grid').innerHTML='<div class="empty">Could not load graph data.</div>';console.error(e)});
</script>
</body></html>
